<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organizador de Links - Instagram</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>
  <div class="app-container">


    <main>


      <section class="links-section">
        <div class="section-header">
          <h2>Seus Links</h2>
          <div style="display: flex; align-items: center; gap: 0.5rem;">
            <span id="link-count" class="badge">0</span>
            <button id="undo-btn" class="undo-btn" title="Desfazer última cópia (Voltar no tempo)">
              <span class="material-symbols-outlined" style="font-size: 1.1rem; margin-right: 0.25rem;">history</span> Voltar no Tempo
            </button>
          </div>
        </div>
        <div class="color-legend">
          <span class="legend-item"><span class="legend-dot dot-amber"></span> Último copiado</span>
          <span class="legend-item"><span class="legend-dot dot-cyan"></span> Penúltimo copiado</span>
          <span class="legend-item"><span class="legend-dot dot-green"></span> Copiados anteriores</span>
        </div>
        <div id="links-container" class="links-container">
          <!-- Links will be injected here -->
        </div>
      </section>
    </main>
  </div>
  <div id="toast" class="toast"></div>
  <script src="script.js"></script>
</body>
</html>
