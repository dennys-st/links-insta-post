<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organizador de Links - Instagram</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>
  <div class="app-container">


    <main>


      <section class="links-section">
        <div class="section-header">
          <h2>Seus Links</h2>
          <div style="display: flex; align-items: center; gap: 0.5rem;">
            <span id="link-count" class="badge">0</span>
            <button id="clear-all-btn" class="delete-btn" style="width: auto; height: auto; padding: 0.25rem 0.75rem; font-size: 0.8rem; background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3);" title="Remover Todos os Links">
              <span class="material-symbols-outlined" style="font-size: 1.1rem; margin-right: 0.25rem;">delete_sweep</span> Limpar Todos
            </button>
          </div>
        </div>
        <div id="links-container" class="links-container">
          <!-- Links will be injected here -->
        </div>
      </section>
    </main>
  </div>
  <div id="toast" class="toast"></div>
  <script src="script.js"></script>
</body>
</html>
